# One worker keeps the sequential round-robin demonstration easy to follow.
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format routing '$remote_addr "$request" status=$status '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'time=$request_time';
    access_log /dev/stdout routing;

    # Docker's embedded DNS, not a hardcoded backend IP.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    upstream backend_pool {
        zone backend_pool 64k;
        # Round-robin is the default; no invented round_robin directive.
        # To compare algorithms, add: least_conn;
        server backend_1:3000 resolve max_fails=1 fail_timeout=3s;
        server backend_2:3000 resolve max_fails=1 fail_timeout=3s;
    }
    server {
        listen 80;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        add_header X-Backend-Address $upstream_addr always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

        # Gateway liveness only: this does not claim either backend is ready.
        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","component":"loadbalancer"}\n';
        }
        # Backend readiness through the same upstream pool as real traffic.
        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            # Retry a failed GET on the other node BEFORE sending a response.
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
            proxy_buffering on;
        }
    }
}
