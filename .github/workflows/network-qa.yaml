name: Network QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docker-network-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and start topology
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Run real networking checks
        run: python3 scripts/qa.py all
      - name: Collect configuration and routing logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose config > artifacts/compose-rendered.yaml
          docker compose ps -a > artifacts/containers.txt
          docker compose logs --no-color > artifacts/container-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-qa-evidence
          path: artifacts/
      - name: Clean up
        if: always()
        run: docker compose --profile tools down --remove-orphans
